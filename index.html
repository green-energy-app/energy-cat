<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bows & Chest Bibs Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', 'Kanit', sans-serif;
      background-color: #fff4f7;
    }
    .clay-btn {
      box-shadow: 0 6px 0 #e08298, 0 10px 15px rgba(255, 105, 180, 0.2);
      transition: all 0.15s ease;
    }
    .clay-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #e08298, 0 4px 6px rgba(255, 105, 180, 0.2);
    }
    .clay-card {
      background: #ffffff;
      border: 3px solid #ffe1e9;
      box-shadow: 0 8px 20px rgba(235, 110, 148, 0.12);
      border-radius: 24px;
    }
    .tab-active {
      background-color: #ff4785 !important;
      color: white !important;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-4xl w-full clay-card p-6 md:p-8 relative">
    
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b-2 border-pink-100">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎀</span>
        <div>

          <p class="text-sm text-pink-500">แต่งตัวน้องแมวด้วยผ้ากันเปื้อนใหญ่เต็มอก และปลอกคอสุดน่ารัก</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="bg-amber-100 border-2 border-amber-300 rounded-full px-4 py-1.5 flex items-center gap-2">

          <span id="fish-count" class="font-bold text-amber-800 text-lg">100</span>
        </div>
        <button onclick="stripAll()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold px-4 py-2 rounded-2xl flex items-center gap-2 border-2 border-pink-200 transition">
          🔄 Strip All
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- SVG Avatar Canvas -->
        <svg id="cat-avatar" viewBox="0 0 300 320" class="w-64 h-64 filter drop-shadow-md">

          <!-- Tail -->

          <!-- Body -->
          <ellipse cx="150" cy="220" rx="65" ry="60" fill="#ffd5b5" stroke="#e08b52" stroke-width="4" />
          <!-- Paws -->

          <ellipse cx="185" cy="270" rx="18" ry="12" fill="#fff" stroke="#e08b52" stroke-width="3" />

          <!-- Head -->
          <ellipse cx="150" cy="120" rx="75" ry="60" fill="#ffd5b5" stroke="#e08b52" stroke-width="4" />
          
          <!-- Ears -->
          <polygon points="85,80 70,20 115,55" fill="#ffd5b5" stroke="#e08b52" stroke-width="4" stroke-linejoin="round" />
          <polygon points="90,75 78,32 110,58" fill="#ffb0b0" />
          
          <polygon points="215,80 230,20 185,55" fill="#ffd5b5" stroke="#e08b52" stroke-width="4" stroke-linejoin="round" />
          <polygon points="210,75 222,32 190,58" fill="#ffb0b0" />

          <!-- Eyes -->
          <ellipse cx="120" cy="115" rx="8" ry="12" fill="#2d3748" />
          <circle cx="118" cy="110" r="3" fill="#fff" />
          <ellipse cx="180" cy="115" rx="8" ry="12" fill="#2d3748" />
          <circle cx="178" cy="110" r="3" fill="#fff" />

          <!-- Cheeks -->
          <ellipse cx="100" cy="130" rx="10" ry="6" fill="#ff9999" opacity="0.6" />
          <ellipse cx="200" cy="130" rx="10" ry="6" fill="#ff9999" opacity="0.6" />

          <!-- Nose & Mouth -->
          <polygon points="150,123 145,118 155,118" fill="#ff8080" />
          <path d="M 142 128 Q 150 135 150 128 Q 150 135 158 128" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round" />

          <!-- DYNAMIC ACCESORIES LAYER -->
          <!-- 1. Large Bib Layer (Under Collar, Covers Chest Big Time) -->
          <g id="layer-bib"></g>

          <!-- 2. Collar & Bell Layer (Sits at Neck line) -->
          <g id="layer-collar"></g>

          <!-- 3. Headwear Layer (Bows & Hats) -->
          <g id="layer-head"></g>
        </svg>

        <p class="text-xs text-pink-400 mt-2 font-medium">ลองเลือกชุดแต่งกายให้น้องแมวได้เลย!</p>
      </div>

      <!-- Item Selection Controls -->
      <div class="md:col-span-7 flex flex-col">
        
        <!-- Category Nav -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button onclick="switchTab('bibs')" id="tab-bibs" class="tab-btn tab-active py-2.5 px-2 rounded-2xl font-bold text-sm bg-pink-100 text-pink-600 transition text-center flex items-center justify-center gap-1">
            🍼 ผ้ากันเปื้อนใหญ่ (10)
          </button>
          <button onclick="switchTab('collars')" id="tab-collars" class="tab-btn py-2.5 px-2 rounded-2xl font-bold text-sm bg-pink-100 text-pink-600 transition text-center flex items-center justify-center gap-1">
            🔔 ปลอกคอ/กระดิ่ง (10)
          </button>
          <button onclick="switchTab('hats')" id="tab-hats" class="tab-btn py-2.5 px-2 rounded-2xl font-bold text-sm bg-pink-100 text-pink-600 transition text-center flex items-center justify-center gap-1">
            🎀 โบว์/หมวก (10)
          </button>
        </div>

        <!-- Items Grid Container -->
        <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-2 gap-3 max-h-[340px] overflow-y-auto p-1 pr-2">
          <!-- Items will be injected by JS -->
        </div>

      </div>

    </div>
  </div>

    function renderGrid() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      
      const items = itemsData[currentTab];
      const categoryKey = currentTab === 'bibs' ? 'bib' : currentTab === 'collars' ? 'collar' : 'head';

      items.forEach(item => {
        const isEquipped = equipped[categoryKey] && equipped[categoryKey].id === item.id;
        
        const card = document.createElement('div');
        card.className = `clay-card p-3 flex flex-col items-center justify-between transition cursor-pointer relative overflow-hidden ${isEquipped ? 'border-pink-500 bg-pink-50/50' : 'hover:border-pink-300'}`;
        card.onclick = () => selectItem(categoryKey, item);

        card.innerHTML = `
          <div class="text-3xl mb-1">${item.icon}</div>
          <div class="text-xs font-bold text-gray-700 text-center line-clamp-1 mb-2">${item.name}</div>
          
          <button class="w-full py-1.5 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
            isEquipped 
              ? 'bg-pink-500 text-white' 
              : item.price === 0 
                ? 'bg-green-400 text-white hover:bg-green-500' 
                : 'bg-amber-300 text-amber-900 hover:bg-amber-400'
          }">
            ${isEquipped ? 'ถอดออก' : item.price === 0 ? 'ใส่เลย (ฟรี)' : `🐟 ${item.price}`}
          </button>
        `;

        grid.appendChild(card);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      renderGrid();
    }

    function selectItem(category, item) {
      if (equipped[category] && equipped[category].id === item.id) {
        // Unequip
        equipped[category] = null;
      } else {
        // Equip
        equipped[category] = item;
      }
      
      updateAvatarLayers();
      renderGrid();
    }

    function updateAvatarLayers() {
      document.getElementById('layer-bib').innerHTML = equipped.bib ? equipped.bib.svg : '';
      document.getElementById('layer-collar').innerHTML = equipped.collar ? equipped.collar.svg : '';
      document.getElementById('layer-head').innerHTML = equipped.head ? equipped.head.svg : '';
    }

    function stripAll() {
      equipped = { bib: null, collar: null, head: null };
      updateAvatarLayers();
      renderGrid();
    }

    // Initialize
    renderGrid();
  </script>
</body>
</html>
