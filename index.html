<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bows & Chest Bibs Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #fffbfa;
    }

    /* Original Curved Studio Card Container */
    .studio-container {
      background: #ffffff;
      border: 2px solid #fff0f3;
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
    }

    /* Category Navigation Buttons */
    .nav-btn {
      border-radius: 20px;
      font-weight: 700;
      transition: all 0.2s ease;
      font-size: 15px;
    }
    .nav-btn-inactive {
      background-color: #fff0f5;
      color: #e03167;
      border: 1.5px solid #ffe3ec;
    }
    .nav-btn-active {
      background-color: #f1356d !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(241, 53, 109, 0.3);
    }

    /* Strip All Button */
    .strip-btn {
      background-color: #ffe8ee;
      color: #f1356d;
      border-radius: 18px;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      transition: all 0.2s ease;
    }
    .strip-btn:hover {
      background-color: #ffd6e0;
    }

    /* Item Card Grid UI */
    .item-card {
      background-color: #f8fafc;
      border: 2px solid #f1f5f9;
      border-radius: 24px;
      transition: all 0.2s ease;
      min-height: 140px;
    }
    .item-card:hover {
      border-color: #ffb6c1;
      transform: translateY(-2px);
    }
    .item-card.selected {
      border-color: #f1356d;
      background-color: #fff0f5;
    }

    /* Fish Coin Badge */
    .fish-badge {
      background-color: #ffcc00;
      color: #5c3a00;
      font-weight: 700;
      border-radius: 16px;
      padding: 2px 14px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #fff0f5;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #ffb6c1;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full studio-container p-6">
    
    <!-- Header Bar -->

      <button onclick="stripAll()" class="strip-btn flex items-center gap-1.5">

    </div>

    <!-- Category Tabs -->
    <div class="grid grid-cols-2 gap-3 mb-5">

        🎀 Bows & Hats

      <button onclick="switchTab('bibs')" id="tab-bibs" class="nav-btn nav-btn-active py-2.5 px-3 flex items-center justify-center gap-2">
        🍼 Cute Bibs & Collars

    </div>

        <!-- Accessories Layers -->
        <!-- Layer 1: Large Chest Bibs -->
        <g id="layer-bib"></g>
        <!-- Layer 2: Neck Collars & Bells -->
        <g id="layer-collar"></g>
        <!-- Layer 3: Head Bows & Hats -->
        <g id="layer-head"></g>
      </svg>
    </div>

    <!-- Items Grid Container -->
    <div id="items-grid" class="grid grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-1 custom-scroll">
      <!-- Generated via JS -->
    </div>

  </div>

      ]
    };

    function renderGrid() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';
      
      const items = itemsData[currentTab];

      items.forEach(item => {
        const isEquipped = equipped[item.type] && equipped[item.type].id === item.id;
        
        const card = document.createElement('div');
        card.className = `item-card p-4 flex flex-col items-center justify-between cursor-pointer ${isEquipped ? 'selected' : ''}`;
        card.onclick = () => selectItem(item.type, item);

        card.innerHTML = `
          <div class="text-3xl my-1">${item.icon}</div>
          <div class="text-sm font-bold text-gray-800 text-center my-1">${item.name}</div>
          
          <div class="fish-badge">
            <span>🐟</span>
            <span>${item.price}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('nav-btn-active');
        b.classList.add('nav-btn-inactive');
      });
      document.getElementById(`tab-${tab}`).classList.add('nav-btn-active');
      document.getElementById(`tab-${tab}`).classList.remove('nav-btn-inactive');
      renderGrid();
    }

    function selectItem(type, item) {
      if (equipped[type] && equipped[type].id === item.id) {
        equipped[type] = null;
      } else {
        equipped[type] = item;
      }
      
      updateAvatarLayers();
      renderGrid();
    }

    function updateAvatarLayers() {
      document.getElementById('layer-bib').innerHTML = equipped.bib ? equipped.bib.svg : '';
      document.getElementById('layer-collar').innerHTML = equipped.collar ? equipped.collar.svg : '';
      document.getElementById('layer-head').innerHTML = equipped.head ? equipped.head.svg : '';
    }

    function stripAll() {
      equipped = { bib: null, collar: null, head: null };
      updateAvatarLayers();
      renderGrid();
    }

    // Initialize
    renderGrid();
  </script>
</body>
</html>
