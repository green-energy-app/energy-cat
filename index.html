<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Cat - Kawaii Pet Game</title>
    <style>
        :root {
            --bg-color: #ffe6f0;
            --card-bg: #ffffff;
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --accent: #70a1ff;
            --text-color: #2f3542;
            --bar-bg: #eccc68;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            padding: 24px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .notif-btn {
            background: #eccc68;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .notif-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Screen & Pet Canvas */
        .pet-screen {
            background: #f1f2f6;
            border-radius: 16px;
            height: 220px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            border: 4px solid #dfe4ea;
        }

        /* Cat Avatar Visuals */
        .cat {
            position: relative;
            width: 120px;
            height: 120px;
            transition: transform 0.3s;
        }

        .cat-head {
            width: 100px;
            height: 85px;
            background: #ffa502;
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            top: 20px;
            left: 10px;
        }

        .ear {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #ffa502;
            position: absolute;
            top: -10px;
        }
        .ear.left { left: 5px; transform: rotate(-15deg); }
        .ear.right { right: 5px; transform: rotate(15deg); }

        .eyes {
            position: absolute;
            top: 35px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: #2f3542;
            border-radius: 50%;
            transition: all 0.3s;
        }

        /* Closed Eyes for Sleeping */
        .cat.sleeping .eye {
            height: 4px;
            border-radius: 0;
            border-top: 3px solid #2f3542;
            background: transparent;
            margin-top: 6px;
        }

        .mouth {
            width: 10px;
            height: 6px;
            border-bottom: 2px solid #2f3542;
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
            left: 45px;
        }

        .zzz {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #70a1ff;
            opacity: 0;
            animation: floatZzz 2s infinite;
            display: none;
        }

        .cat.sleeping + .zzz {
            display: block;
        }

        @keyframes floatZzz {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-15px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
        }

        /* Stats Bars */
        .stat-box {
            margin-bottom: 12px;
            text-align: left;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .bar-outer {
            width: 100%;
            height: 16px;
            background: #dfe4ea;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            width: 100%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .energy-bar { background: #ff6b81; }
        .hunger-bar { background: #ffa502; }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 8px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #e84118;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-sleep { background: #70a1ff; box-shadow: 0 4px 0 #1e90ff; }
        .btn-feed { background: #2ed573; box-shadow: 0 4px 0 #26af5f; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 Energy Cat</h1>
        <button class="notif-btn" id="notifBtn" onclick="requestNotificationPermission()">🔔 Enable Notifications</button>

        <div class="pet-screen">
            <div class="cat" id="cat">
                <div class="cat-head">
                    <div class="ear left"></div>
                    <div class="ear right"></div>
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            <div class="zzz">Zzz...</div>
        </div>

        <div class="stat-box">
            <div class="stat-label">
                <span>⚡ Energy</span>
                <span id="energyText">100%</span>
            </div>
            <div class="bar-outer">
                <div class="bar-inner energy-bar" id="energyBar"></div>
            </div>
        </div>

        <div class="stat-box">
            <div class="stat-label">
                <span>🍖 Fullness</span>
                <span id="hungerText">100%</span>
            </div>
            <div class="bar-outer">
                <div class="bar-inner hunger-bar" id="hungerBar"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-feed" onclick="feedPet()">🍕 Feed</button>
            <button class="btn btn-sleep" onclick="toggleSleep()" id="sleepBtn">😴 Sleep</button>
            <button class="btn" onclick="playPet()">🎾 Play</button>
        </div>
    </div>

    <script>
        // Load stored state or use initial defaults
        let energy = parseFloat(localStorage.getItem('cat_energy')) || 100;
        let hunger = parseFloat(localStorage.getItem('cat_hunger')) || 100;
        let isSleeping = localStorage.getItem('cat_isSleeping') === 'true';
        let lastTime = parseInt(localStorage.getItem('cat_lastTime')) || Date.now();

        // Stat decay/recovery rates (% per second)
        const DECAY_RATE_ENERGY = 0.5;  // Decreases by 0.5%/s when awake
        const SLEEP_RECOVER_RATE = 2.0; // Recovers by 2.0%/s when asleep
        const DECAY_RATE_HUNGER = 0.3;  // Decreases by 0.3%/s continuously

        // Calculate stats decay for offline time
        function calculateOfflineDecay() {
            const now = Date.now();
            const secondsPassed = Math.floor((now - lastTime) / 1000);

            if (secondsPassed > 0) {
                if (isSleeping) {
                    energy = Math.min(100, energy + (secondsPassed * SLEEP_RECOVER_RATE));
                } else {
                    energy = Math.max(0, energy - (secondsPassed * DECAY_RATE_ENERGY));
                }
                hunger = Math.max(0, hunger - (secondsPassed * DECAY_RATE_HUNGER));

                // Send notification if stats are low upon returning
                if (energy < 20 || hunger < 20) {
                    sendNotification("Your cat needs attention!", "Your cat's energy or fullness is running very low!");
                }
            }
            saveState();
        }

        // Save current state to LocalStorage
        function saveState() {
            localStorage.setItem('cat_energy', energy);
            localStorage.setItem('cat_hunger', hunger);
            localStorage.setItem('cat_isSleeping', isSleeping);
            localStorage.setItem('cat_lastTime', Date.now());
        }

        // Request browser push notification permission
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById('notifBtn').innerText = "🔔 Notifications Enabled";
                        sendNotification("Setup Complete!", "You will now receive notifications when your cat is low on energy.");
                    }
                });
            } else {
                alert("This browser does not support notifications.");
            }
        }

        // Send push notification
        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png"
                });
            }
        }

        // Update UI components
        function updateUI() {
            const cat = document.getElementById('cat');
            const sleepBtn = document.getElementById('sleepBtn');

            // Update sleeping eyes & button text
            if (isSleeping) {
                cat.classList.add('sleeping');
                sleepBtn.innerText = "⏰ Wake Up";
            } else {
                cat.classList.remove('sleeping');
                sleepBtn.innerText = "😴 Sleep";
            }

            // Update progress bars
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyText').innerText = Math.round(energy) + '%';
            
            document.getElementById('hungerBar').style.width = hunger + '%';
            document.getElementById('hungerText').innerText = Math.round(hunger) + '%';
        }

        // Toggle sleep state
        function toggleSleep() {
            isSleeping = !isSleeping;
            saveState();
            updateUI();
        }

        // Feed action
        function feedPet() {
            if (isSleeping) {
                alert("Your cat is sleeping right now!");
                return;
            }
            hunger = Math.min(100, hunger + 25);
            saveState();
            updateUI();
        }

        // Play action
        function playPet() {
            if (isSleeping) {
                alert("Your cat is sleeping right now!");
                return;
            }
            if (energy < 15) {
                alert("Your cat is too tired to play! Put it to sleep first.");
                return;
            }
            energy = Math.max(0, energy - 15);
            hunger = Math.max(0, hunger - 10);
            saveState();
            updateUI();
        }

        // Main Game Loop (Runs every second)
        let notifSent = false;
        setInterval(() => {
            if (isSleeping) {
                energy = Math.min(100, energy + SLEEP_RECOVER_RATE);
            } else {
                energy = Math.max(0, energy - DECAY_RATE_ENERGY);
            }

            hunger = Math.max(0, hunger - DECAY_RATE_HUNGER);

            // Trigger notification when energy reaches 20% or lower
            if (energy <= 20 && !notifSent) {
                sendNotification("⚡ Low Energy Alert!", "Your cat's energy dropped below 20%! Put your cat to sleep soon.");
                notifSent = true;
            } else if (energy > 20) {
                notifSent = false;
            }

            saveState();
            updateUI();
        }, 1000);

        // Initialize game
        calculateOfflineDecay();
        updateUI();

        // Check initial notification status
        if ("Notification" in window && Notification.permission === "granted") {
            document.getElementById('notifBtn').innerText = "🔔 Notifications Enabled";
        }
    </script>
</body>
</html>
