<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Pet Care & Dress-Up Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #fceade;
    }
    
    .game-card {
      background: #ffffff;
      border: 3px solid #ffd6ba;
      border-radius: 32px;
      box-shadow: 0 12px 35px rgba(224, 139, 82, 0.15);
    }

    /* Progress & Status Bars */
    .bar-bg {
      background-color: #f3f4f6;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    /* Navigation Tabs */
    .tab-btn {
      background-color: #fff0f5;
      color: #ff3366;
      border: 2px solid #ffe0ea;
      border-radius: 18px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background-color: #ff3377 !important;
      color: #ffffff !important;
      border-color: #ff3377 !important;
      box-shadow: 0 4px 12px rgba(255, 51, 119, 0.3);
    }

    /* Action Buttons */
    .act-btn {
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .act-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* Studio Item Card */
    .item-card {
      background-color: #f8fafc;
      border: 2px solid #f1f5f9;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .item-card:hover {
      border-color: #ffb6c1;
      transform: translateY(-2px);
    }
    .item-card.equipped {
      border-color: #ff3377;
      background-color: #fff0f5;
    }

    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #fff0f5;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #ffb6c1;
      border-radius: 10px;
    }
  </style>
</head>

    // UI View Switcher
    function setView(mode) {
      document.getElementById('view-care').classList.toggle('hidden', mode !== 'care');
      document.getElementById('view-studio').classList.toggle('hidden', mode !== 'studio');
      
      document.getElementById('mode-care').classList.toggle('active', mode === 'care');
      document.getElementById('mode-studio').classList.toggle('active', mode === 'studio');

      if(mode === 'studio') renderStudioGrid();
    }

    // Care Actions Logic
    function doAction(action) {
      if (action === 'feed') {
        state.energy = Math.min(state.maxEnergy, state.energy + 25);
        addExp(10);
      } else if (action === 'play') {
        if (state.energy < 15) {
          alert("Too tired to play! Feed or let your cat sleep.");
          return;
        }
        state.energy -= 15;
        state.fish += 10;
        addExp(25);
      } else if (action === 'sleep') {
        state.energy = Math.min(state.maxEnergy, state.energy + 40);
        addExp(15);
      } else if (action === 'clean') {
        addExp(15);
        state.fish += 5;
      }

      updateUI();
    }

    function addExp(amount) {
      state.exp += amount;
      if (state.exp >= state.maxExp) {
        state.exp -= state.maxExp;
        state.level += 1;
        state.maxExp += 20;

        // Rank Promotion check
        if (state.level >= 10 && state.rankIndex === 0) state.rankIndex = 1;
        else if (state.level >= 20 && state.rankIndex === 1) state.rankIndex = 2;
        else if (state.level >= 30 && state.rankIndex === 2) state.rankIndex = 3;
      }
    }

    function updateUI() {
      document.getElementById('ui-fish').innerText = state.fish;
      document.getElementById('ui-rank').innerText = ranks[state.rankIndex];
      document.getElementById('ui-level').innerText = `Lv.${state.level}`;

      document.getElementById('ui-energy-text').innerText = `${state.energy} / ${state.maxEnergy}`;
      document.getElementById('ui-energy-bar').style.width = `${(state.energy / state.maxEnergy) * 100}%`;

      document.getElementById('ui-exp-text').innerText = `${state.exp} / ${state.maxExp}`;
      document.getElementById('ui-exp-bar').style.width = `${(state.exp / state.maxExp) * 100}%`;
    }

    // Studio Logic
    function switchStudioTab(tab) {
      studioTab = tab;
      document.querySelectorAll('#view-studio .tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`stab-${tab}`).classList.add('active');
      renderStudioGrid();
    }

    function renderStudioGrid() {
      const grid = document.getElementById('studio-grid');
      grid.innerHTML = '';

      const items = itemsData[studioTab];
      const categoryKey = studioTab === 'bibs' ? 'bib' : studioTab === 'collars' ? 'collar' : 'head';

      items.forEach(item => {
        const isEquipped = equipped[categoryKey] && equipped[categoryKey].id === item.id;

        const card = document.createElement('div');
        card.className = `item-card p-3 flex flex-col items-center justify-between cursor-pointer ${isEquipped ? 'equipped' : ''}`;
        card.onclick = () => selectStudioItem(categoryKey, item);

        card.innerHTML = `
          <div class="text-2xl mb-1">${item.icon}</div>
          <div class="text-xs font-bold text-gray-700 text-center mb-1">${item.name}</div>
          <div class="bg-amber-300 text-amber-900 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full flex items-center gap-1">
            <span>🐟</span> ${item.price}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function selectStudioItem(category, item) {
      if (equipped[category] && equipped[category].id === item.id) {
        equipped[category] = null;
      } else {
        equipped[category] = item;
      }

      updateAvatarLayers();
      renderStudioGrid();
    }

    function updateAvatarLayers() {
      document.getElementById('layer-bib').innerHTML = equipped.bib ? equipped.bib.svg : '';
      document.getElementById('layer-collar').innerHTML = equipped.collar ? equipped.collar.svg : '';
      document.getElementById('layer-head').innerHTML = equipped.head ? equipped.head.svg : '';
    }

    function stripAll() {
      equipped = { bib: null, collar: null, head: null };
      updateAvatarLayers();
      renderStudioGrid();
    }

    // Auto energy drop slowly over time
    setInterval(() => {
      if (state.energy > 0) {
        state.energy = Math.max(0, state.energy - 1);
        updateUI();
      }
    }, 8000);

    // Initial render
    updateUI();
  </script>
</body>
</html>
