<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Cat Dress-Up Studio - ห้องแต่งตัวน้องแมว</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fdf2f8;
        }
        .item-card {
            transition: all 0.2s ease-in-out;
        }
        .item-card:hover {
            transform: translateY(-4px);
        }
        /* Style scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-pink-500 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid font-bold fa-cat"></i> Kawaii Cat Dress-Up
            </h1>
            <div class="bg-pink-700/50 px-4 py-1.5 rounded-full flex items-center gap-2 border border-pink-300">
                <span class="text-xl">🐟</span>
                <span id="fish-count" class="font-bold text-lg text-yellow-300">1,000</span>
                <button onclick="addFish()" class="ml-2 bg-yellow-400 hover:bg-yellow-300 text-pink-900 text-xs px-2 py-1 rounded-md font-bold transition">
                    + เพิ่มปลา
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-12 gap-6 my-auto">
        
        <!-- Left Side: Cat Display Canvas -->
        <section class="md:col-span-5 bg-white rounded-3xl p-6 shadow-xl border-4 border-pink-200 flex flex-col items-center justify-between relative overflow-hidden min-h-[420px]">
            <!-- Background Glow -->
            <div class="absolute inset-0 bg-gradient-to-b from-pink-50 to-purple-50 -z-10"></div>
            
            <div class="w-full flex justify-between items-center text-sm font-semibold text-pink-600">
                <span id="cat-status"><i class="fa-solid fa-sparkles"></i> แต่งตัวน้องแมวสุดน่ารัก</span>
                <button onclick="randomOutfit()" class="bg-pink-100 hover:bg-pink-200 text-pink-600 px-3 py-1 rounded-full text-xs font-bold transition">
                    🎲 สุ่มชุด
                </button>
            </div>

            <!-- Dynamic SVG Cat Avatar -->
            <div class="relative w-64 h-64 my-auto flex items-center justify-center">
                <!-- Aura / Effect Layer -->
                <div id="layer-aura" class="absolute inset-0 flex items-center justify-center text-6xl pointer-events-none opacity-0 transition-all"></div>

                <!-- Base Cat SVG -->
                <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                    <!-- Tail -->
                    <path d="M 140 140 C 170 130 170 90 150 90" stroke="#f9a8d4" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <!-- Body -->
                    <ellipse cx="100" cy="135" rx="45" ry="40" fill="#fbcfe8" />
                    <ellipse cx="100" cy="135" rx="35" ry="30" fill="#fdf2f8" />
                    <!-- Ears -->
                    <polygon points="65,55 50,20 80,40" fill="#fbcfe8" stroke="#f472b6" stroke-width="3" />
                    <polygon points="135,55 150,20 120,40" fill="#fbcfe8" stroke="#f472b6" stroke-width="3" />
                    <polygon points="67,50 56,28 77,40" fill="#f472b6" />
                    <polygon points="133,50 144,28 123,40" fill="#f472b6" />
                    <!-- Head -->
                    <circle cx="100" cy="75" r="45" fill="#fbcfe8" />
                    <!-- Eyes -->
                    <circle cx="85" cy="70" r="5" fill="#334155" />
                    <circle cx="115" cy="70" r="5" fill="#334155" />
                    <circle cx="87" cy="68" r="2" fill="white" />
                    <circle cx="117" cy="68" r="2" fill="white" />
                    <!-- Blush -->
                    <ellipse cx="75" cy="80" rx="6" ry="3" fill="#f472b6" opacity="0.6" />
                    <ellipse cx="125" cy="80" rx="6" ry="3" fill="#f472b6" opacity="0.6" />
                    <!-- Nose & Mouth -->
                    <polygon points="100,77 97,74 103,74" fill="#f472b6" />
                    <path d="M 95 82 Q 100 86 105 82" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />
                    <!-- Paws -->
                    <ellipse cx="80" cy="165" rx="10" ry="8" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
                    <ellipse cx="120" cy="165" rx="10" ry="8" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
                </svg>

                <!-- Clothes Layer -->
                <div id="layer-clothes" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
                <!-- Head Layer -->
                <div id="layer-head" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
                <!-- Shoes Layer -->
                <div id="layer-shoes" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
                <!-- Accessory Layer -->
                <div id="layer-extra" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>
            </div>

            <!-- Action Controls -->
            <div class="w-full flex gap-2">
                <button onclick="resetOutfit()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-semibold transition">
                    <i class="fa-solid fa-rotate-left"></i> ถอดชุดทั้งหมด
                </button>
            </div>
        </section>

        <!-- Right Side: Dressing Closet / Shop -->
        <section class="md:col-span-7 bg-white rounded-3xl p-6 shadow-xl border-4 border-pink-200 flex flex-col">
            <!-- Category Tabs Navigation -->
            <div class="flex border-b-2 border-pink-100 mb-4 gap-1 overflow-x-auto pb-2">
                <button onclick="switchCategory('head')" id="tab-head" class="tab-btn active-tab px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap transition bg-pink-500 text-white">
                    🎓 ของบนหัว
                </button>
                <button onclick="switchCategory('clothes')" id="tab-clothes" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap transition bg-pink-50 text-pink-600 hover:bg-pink-100">
                    👔 ชุด
                </button>
                <button onclick="switchCategory('shoes')" id="tab-shoes" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap transition bg-pink-50 text-pink-600 hover:bg-pink-100">
                    👟 รองเท้า
                </button>
                <button onclick="switchCategory('extras')" id="tab-extras" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap transition bg-pink-50 text-pink-600 hover:bg-pink-100">
                    ✨ ของเสริม
                </button>
            </div>

            <!-- Items Grid -->
            <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto max-h-[360px] p-1">
                <!-- Items dynamically injected here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-pink-100 text-center py-3 text-xs text-pink-500 border-t border-pink-200">
        Kawaii Cat Dress-Up Studio &copy; 2026 - แต่งตัวน้องแมวเพลินๆ
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        // State Management
        let fish = 1000;
        let currentCategory = 'head';
        
        let equipped = {
            head: null,
            clothes: null,
            shoes: null,
            extras: null
        };

        // Inventory Database
        const items = {
            head: [
                { id: 'h1', name: 'หมวกรับปริญญา', price: 0, icon: '🎓', layerHtml: '<div class="absolute -top-4 text-6xl">🎓</div>' },
                { id: 'h2', name: 'มงกุฎกษัตริย์', price: 100, icon: '👑', layerHtml: '<div class="absolute -top-5 text-6xl">👑</div>' },
                { id: 'h3', name: 'หมวกปาร์ตี้', price: 50, icon: '🥳', layerHtml: '<div class="absolute -top-4 text-5xl">🎉</div>' },
                { id: 'h4', name: 'มงกุฎดอกไม้', price: 150, icon: '🌸', layerHtml: '<div class="absolute -top-3 text-5xl">🌸</div>' },
                { id: 'h5', name: 'หมวกโจรสลัด', price: 200, icon: '🏴‍☠️', layerHtml: '<div class="absolute -top-5 text-6xl">🏴‍☠️</div>' },
                { id: 'h6', name: 'โบสีแดง', price: 80, icon: '🎀', layerHtml: '<div class="absolute -top-2 text-5xl">🎀</div>' },
                { id: 'h7', name: 'หมวกเชฟ', price: 120, icon: '👨‍🍳', layerHtml: '<div class="absolute -top-6 text-6xl">👨‍🍳</div>' },
                { id: 'h8', name: 'หมวกไหมพรม', price: 150, icon: '🧶', layerHtml: '<div class="absolute -top-4 text-5xl">🧢</div>' }
            ],
            clothes: [
                { id: 'c1', name: 'ชุดเอี๊ยม', price: 0, icon: '👖', layerHtml: '<div class="absolute top-[115px] text-5xl">👖</div>' },
                { id: 'c2', name: 'เดรสสีหวาน', price: 150, icon: '👗', layerHtml: '<div class="absolute top-[115px] text-5xl">👗</div>' },
                { id: 'c3', name: 'ชุดทักซิโด้', price: 300, icon: '🥋', layerHtml: '<div class="absolute top-[115px] text-5xl">👔</div>' },
                { id: 'c4', name: 'เสื้อฮู้ดดี้', price: 200, icon: '🧥', layerHtml: '<div class="absolute top-[115px] text-5xl">🧥</div>' },
                { id: 'c5', name: 'ชุดกะลาสี', price: 250, icon: '👔', layerHtml: '<div class="absolute top-[115px] text-5xl">🎽</div>' },
                { id: 'c6', name: 'ชุดแม่มด', price: 350, icon: '🧙‍♀️', layerHtml: '<div class="absolute top-[115px] text-5xl">🥻</div>' },
                { id: 'c7', name: 'เสื้อฮาวาย', price: 180, icon: '🌺', layerHtml: '<div class="absolute top-[115px] text-5xl">👕</div>' },
                { id: 'c8', name: 'ผ้าคลุมฮีโร่', price: 400, icon: '🦸‍♂️', layerHtml: '<div class="absolute top-[110px] text-6xl">🦸‍♂️</div>' }
            ],
            shoes: [
                { id: 's1', name: 'รองเท้าผ้าใบ', price: 0, icon: '👟', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>👟</span><span>👟</span></div>' },
                { id: 's2', name: 'รองเท้าบูท', price: 120, icon: '🥾', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>🥾</span><span>🥾</span></div>' },
                { id: 's3', name: 'สเกตบอร์ด/สเกต', price: 250, icon: '🛼', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>🛼</span><span>🛼</span></div>' },
                { id: 's4', name: 'บูททองคำ', price: 500, icon: '🩰', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>✨</span><span>✨</span></div>' },
                { id: 's5', name: 'สลิปเปอร์', price: 80, icon: '🩴', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>🩴</span><span>🩴</span></div>' },
                { id: 's6', name: 'ถุงเท้าอุ้งเท้า', price: 100, icon: '🧦', layerHtml: '<div class="absolute top-[165px] flex gap-8 text-2xl"><span>🧦</span><span>🧦</span></div>' }
            ],
            extras: [
                { id: 'e1', name: 'แว่นกันแดด', price: 0, icon: '🕶️', layerHtml: '<div class="absolute top-[62px] text-3xl">🕶️</div>' },
                { id: 'e2', name: 'แว่นตาตลก', price: 90, icon: '👓', layerHtml: '<div class="absolute top-[62px] text-3xl">👓</div>' },
                { id: 'e3', name: 'คทาเวทมนตร์', price: 300, icon: '🪄', layerHtml: '<div class="absolute top-[110px] right-6 text-4xl">🪄</div>' },
                { id: 'e4', name: 'กระเป๋าสะพาย', price: 150, icon: '🎒', layerHtml: '<div class="absolute top-[120px] left-8 text-3xl">🎒</div>' },
                { id: 'e5', name: 'ออร่าประกายดาว', price: 450, icon: '⭐', layerHtml: '<div class="absolute text-7xl animate-pulse">✨</div>' }
            ]
        };

        // Purchased Trackers
        let purchasedItems = new Set(['h1', 'c1', 's1', 'e1']); // Default unlocked items

        // Initialize App
        window.onload = () => {
            renderGrid();
            updateUI();
        };

        // Switch Category Tabs
        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-pink-500', 'text-white', 'active-tab');
                btn.classList.add('bg-pink-50', 'text-pink-600');
            });
            const activeBtn = document.getElementById(`tab-${cat}`);
            activeBtn.classList.remove('bg-pink-50', 'text-pink-600');
            activeBtn.classList.add('bg-pink-500', 'text-white', 'active-tab');

            renderGrid();
        }

        // Render Item Cards
        function renderGrid() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';

            items[currentCategory].forEach(item => {
                const isOwned = purchasedItems.has(item.id);
                const isEquipped = equipped[currentCategory]?.id === item.id;

                const card = document.createElement('div');
                card.className = `item-card p-3 rounded-2xl border-2 flex flex-col items-center justify-between text-center cursor-pointer ${
                    isEquipped 
                        ? 'border-pink-500 bg-pink-100/60 shadow-md' 
                        : 'border-pink-100 bg-pink-50/30 hover:border-pink-300'
                }`;

                card.onclick = () => handleItemClick(item);

                card.innerHTML = `
                    <div class="text-4xl mb-1">${item.icon}</div>
                    <div class="font-bold text-xs text-slate-700 mb-2">${item.name}</div>
                    ${
                        isEquipped 
                        ? `<span class="bg-pink-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">กำลังใส่</span>`
                        : isOwned
                        ? `<span class="bg-emerald-100 text-emerald-600 text-[10px] px-2 py-0.5 rounded-full font-bold">สวมใส่</span>`
                        : `<span class="bg-yellow-100 text-yellow-700 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1">🐟 ${item.price}</span>`
                    }
                `;

                grid.appendChild(card);
            });
        }

        // Handle Item Click (Buy or Equip/Unequip)
        function handleItemClick(item) {
            const isOwned = purchasedItems.has(item.id);

            if (!isOwned) {
                // Buy logic
                if (fish >= item.price) {
                    fish -= item.price;
                    purchasedItems.add(item.id);
                    equipped[currentCategory] = item;
                } else {
                    alert('ปลาไม่พอ! กดปุ่ม "+ เพิ่มปลา" ได้เลยนะ');
                    return;
                }
            } else {
                // Toggle equip logic
                if (equipped[currentCategory]?.id === item.id) {
                    equipped[currentCategory] = null; // Unequip
                } else {
                    equipped[currentCategory] = item; // Equip
                }
            }

            updateUI();
            renderGrid();
            renderCatOutfit();
        }

        // Render Cat Layers
        function renderCatOutfit() {
            document.getElementById('layer-head').innerHTML = equipped.head ? equipped.head.layerHtml : '';
            document.getElementById('layer-clothes').innerHTML = equipped.clothes ? equipped.clothes.layerHtml : '';
            document.getElementById('layer-shoes').innerHTML = equipped.shoes ? equipped.shoes.layerHtml : '';
            
            const extraLayer = document.getElementById('layer-extra');
            const auraLayer = document.getElementById('layer-aura');

            if (equipped.extras) {
                if (equipped.extras.id === 'e5') { // Aura Special
                    auraLayer.innerHTML = equipped.extras.layerHtml;
                    auraLayer.style.opacity = '1';
                    extraLayer.innerHTML = '';
                } else {
                    extraLayer.innerHTML = equipped.extras.layerHtml;
                    auraLayer.innerHTML = '';
                    auraLayer.style.opacity = '0';
                }
            } else {
                extraLayer.innerHTML = '';
                auraLayer.innerHTML = '';
                auraLayer.style.opacity = '0';
            }
        }

        // Random Outfit Button
        function randomOutfit() {
            Object.keys(items).forEach(cat => {
                const available = items[cat].filter(i => purchasedItems.has(i.id));
                if (available.length > 0 && Math.random() > 0.2) {
                    const randomItem = available[Math.floor(Math.random() * available.length)];
                    equipped[cat] = randomItem;
                } else {
                    equipped[cat] = null;
                }
            });
            renderCatOutfit();
            renderGrid();
        }

        // Reset Outfit
        function resetOutfit() {
            equipped = { head: null, clothes: null, shoes: null, extras: null };
            renderCatOutfit();
            renderGrid();
        }

        // Add Fish Counter
        function addFish() {
            fish += 200;
            updateUI();
            renderGrid();
        }

        // Update Global UI
        function updateUI() {
            document.getElementById('fish-count').innerText = fish.toLocaleString();
        }
    </script>
</body>
</html>
